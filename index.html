<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Lending Tracker</title>

    <!-- Bootstrap CSS library -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Our CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HEADER -->
    <header class="bg-primary text-white py-4">
        <div class="container">
            <h1 class="text-center">Book Lending Tracker</h1>
            <p class="text-center mb-0">
                Keep track of borrowed books and due dates
            </p>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="container my-5">

        <!-- FIRST SECTION: BOOK FORM -->
        <section class="card shadow-sm p-4 mb-4">

            <h2 class="mb-4">Add a New Loan</h2>

            <form id="loanForm" novalidate>

                <div class="mb-3">
                    <label for="title" class="form-label">
                        Book Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        class="form-control">

                    <div class="error-message" id="titleError"></div>
                </div>

                <div class="mb-3">
                    <label for="author" class="form-label">
                        Author
                    </label>

                    <input
                        type="text"
                        id="author"
                        class="form-control">

                    <div class="error-message" id="authorError"></div>
                </div>

                <div class="mb-3">
                    <label for="borrower" class="form-label">
                        Borrower
                    </label>

                    <input
                        type="text"
                        id="borrower"
                        class="form-control">

                    <div class="error-message" id="borrowerError"></div>
                </div>

                <div class="mb-3">
                    <label for="dueDate" class="form-label">
                        Due Date
                    </label>

                    <input
                        type="date"
                        id="dueDate"
                        class="form-control">

                    <div class="error-message" id="dueDateError"></div>
                </div>

<div class="mb-3">
    <label for="genre" class="form-label">
        Genre
    </label>

    <select id="genre" class="form-select" required>
        <option value="">Select a genre</option>
        <option value="Fiction">Fiction</option>
        <option value="Science">Science</option>
        <option value="History">History</option>
        <option value="Technology">Technology</option>
        
    </select>

    <div class="error-message" id="genreError"></div>
</div>

                <button type="submit" class="btn btn-primary">
                    Add Book
                </button>

            </form>

        </section>

        <!-- SECOND SECTION: LOAN TABLE -->
        <section class="card shadow-sm p-4">

            <h2 class="mb-4">Book Loans</h2>

            <div class="table-responsive">

                <table class="table table-striped table-hover">

                    <thead class="table-dark">
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Borrower</th>
                            <th>Due Date</th>
                            <th>Genre</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="loanTableBody">
                        <!-- JavaScript will add books here -->
                    </tbody>

                </table>

            </div>

            <!-- SUMMARY -->
            <div class="row mt-4">

                <div class="col-md-6">
                    <div class="summary-card">
                        <h5>Total Loans</h5>
                        <h2 id="totalLoans">0</h2>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="summary-card">
                        <h5>Overdue Loans</h5>
                        <h2 id="overdueLoans">0</h2>
                    </div>
                </div>

            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            Book Lending Tracker - 2026
        </p>
    </footer>

    <!-- Bootstrap JavaScript library -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Our JavaScript file -->
    <script src="app.js"></script>
    <link rel="stylesheet" href="style.css">

</body>
</html>
